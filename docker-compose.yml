version: '3.9'

services:
  db:
    image: mysql:5.7
    platform: linux/x86_64
    # restart: always
    container_name: portfolio_db
    environment:
      MYSQL_ROOT_PASSWORD: portfolio
      MYSQL_DATABASE: portfolio
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: portfolio

  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    ports:
      - "8000:80"
    # restart: always
    container_name: portfolio_wordpress
    volumes:
      - ./dist:/var/www/html
    environment:
      WORDPRESS_DB_NAME: portfolio
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: portfolio
      WORDPRESS_DB_PASSWORD: portfolio
